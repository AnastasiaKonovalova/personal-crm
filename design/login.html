<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — эскиз</title>
  <link rel="stylesheet" href="vendor/fonts.css">
  <link rel="stylesheet" href="vendor/tokens.css">
  <link rel="stylesheet" href="vendor/styles.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
<div class="ak-root">
  <header class="ak-header">
    <div class="ak-wrap ak-bar">
      <div class="ak-brand-group">
        <a class="ak-brand ak-brand-logo" href="login.html">
          <svg class="ak-logo" viewBox="0 0 38 28" width="33" height="24" aria-hidden="true"><circle class="ak-logo-fill" cx="14" cy="14" r="12"/><circle class="ak-logo-ring" cx="24" cy="14" r="11"/></svg>
          <span>Свои люди<b>.</b></span>
        </a>
        <span class="ak-brand-note">личная CRM</span>
      </div>
    </div>
  </header>

  <main class="ak-wrap ak-main ak-stack-y ak-login">
    <div>
      <h1 class="ak-page-title">Вход</h1>
      <p class="ak-lede">Введи почту: пришлём ссылку для входа. Пароль не нужен.</p>
    </div>

    <form class="ak-card ak-stack-y" action="login-sent.html" novalidate>
      <div class="ak-field">
        <label class="ak-field-label" for="email">Почта</label>
        <input class="ak-input" id="email" name="email" type="email" placeholder="anna@example.com" autocomplete="email" autofocus>
      </div>
      <div class="ak-btn-row">
        <button class="ak-btn ak-btn-primary" type="submit">Получить ссылку</button>
      </div>
    </form>
  </main>
</div>
</body>
</html>
