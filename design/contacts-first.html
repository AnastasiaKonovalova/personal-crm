<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Первый вход: пустой список — эскиз</title>
  <link rel="stylesheet" href="vendor/fonts.css">
  <link rel="stylesheet" href="vendor/tokens.css">
  <link rel="stylesheet" href="vendor/styles.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
<div class="ak-root">
  <header class="ak-header">
    <div class="ak-wrap ak-bar">
      <div class="ak-brand-group">
        <a class="ak-brand ak-brand-logo" href="contacts-first.html">
          <svg class="ak-logo" viewBox="0 0 38 28" width="33" height="24" aria-hidden="true"><circle class="ak-logo-fill" cx="14" cy="14" r="12"/><circle class="ak-logo-ring" cx="24" cy="14" r="11"/></svg>
          <span>Свои люди<b>.</b></span>
        </a>
        <span class="ak-brand-note">личная CRM</span>
      </div>
      <div class="ak-account">
        <span class="ak-account-email" title="boris@example.com">boris@example.com</span>
        <form action="login.html" method="post">
          <button class="ak-btn ak-btn-text ak-account-out" type="submit" aria-label="Выйти" title="Выйти">
            <svg class="ak-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
            <span class="ak-account-out-label">Выйти</span>
          </button>
        </form>
      </div>
    </div>
  </header>

  <!-- a person who has just signed in for the first time: no contacts, no groups, no «Пора связаться» block -->
  <div class="ak-aurora-zone">
    <div class="ak-aurora" aria-hidden="true"></div>
    <main class="ak-wrap ak-main ak-stack-y">
      <div class="ak-page-head">
        <div>
          <div class="ak-label">Всего: 0</div>
          <h1 class="ak-page-title">Контакты</h1>
        </div>
        <a class="ak-btn ak-btn-primary" href="contact-new.html"><svg class="ak-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>Добавить контакт</a>
      </div>

      <nav class="ak-switch" aria-label="Разделы"><a href="contacts-first.html" aria-current="page">Контакты</a><a href="groups-empty.html">Группы</a></nav>

      <form class="ak-search-form" role="search">
        <div class="ak-search">
          <label class="ak-search-box">
            <span class="ak-sr-only">Поиск по имени</span>
            <svg class="ak-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <input class="ak-input" type="search" name="q" placeholder="Поиск по имени" value="">
          </label>
          <span class="ak-search-actions"><button class="ak-btn ak-btn-ghost" type="submit">Найти</button></span>
        </div>
        <!-- no groups yet: a link in place of the filter (decision 31) -->
        <a class="ak-btn ak-btn-text ak-groups-link" href="groups-empty.html#new-group">Тут можно создавать группы контактов</a>
      </form>

      <div class="ak-empty">
        <h2 class="ak-empty-title">Контактов пока нет</h2>
        <p>Добавь первый контакт</p>
      </div>
    </main>
  </div>
</div>
</body>
</html>
