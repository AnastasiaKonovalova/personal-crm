<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Новый контакт — эскиз</title>
  <link rel="stylesheet" href="vendor/fonts.css">
  <link rel="stylesheet" href="vendor/tokens.css">
  <link rel="stylesheet" href="vendor/styles.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
<div class="ak-root">
  <header class="ak-header">
    <div class="ak-wrap ak-bar">
      <a class="ak-brand" href="contacts.html">Личная CRM<b>.</b></a>
    </div>
  </header>

  <main class="ak-wrap ak-main ak-stack-y ak-narrow">
    <a class="ak-back" href="contacts.html">
      <svg class="ak-ico ak-ico-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
      Все контакты
    </a>

    <h1 class="ak-page-title">Новый контакт</h1>

    <form class="ak-card ak-stack-y" novalidate>
      <div class="ak-field">
        <label class="ak-field-label" for="name">Имя<span class="ak-req">*</span></label>
        <input class="ak-input" id="name" placeholder="Анна Смирнова" autofocus>
      </div>
      <div class="ak-field">
        <label class="ak-field-label" for="about">Кто это</label>
        <input class="ak-input" id="about" placeholder="Дизайнер, соседка по даче">
      </div>
      <div class="ak-field">
        <label class="ak-field-label" for="howWeMet">Откуда знакомы</label>
        <input class="ak-input" id="howWeMet" placeholder="Учились вместе на курсах">
      </div>
      <div class="ak-field">
        <label class="ak-field-label" for="phone">Телефон</label>
        <input class="ak-input" id="phone" type="tel" placeholder="+7 900 123-45-67">
      </div>
      <div class="ak-field">
        <label class="ak-field-label" for="email">Почта</label>
        <input class="ak-input" id="email" type="email" placeholder="anna@example.com">
      </div>
      <div class="ak-btn-row">
        <button class="ak-btn ak-btn-primary" type="submit">Сохранить</button>
        <a class="ak-btn ak-btn-ghost" href="contacts.html">Отмена</a>
      </div>
    </form>
  </main>
</div>
</body>
</html>
