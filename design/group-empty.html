<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Пустая группа, страница группы — эскиз</title>
  <link rel="stylesheet" href="vendor/fonts.css">
  <link rel="stylesheet" href="vendor/tokens.css">
  <link rel="stylesheet" href="vendor/styles.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
<div class="ak-root">
  <header class="ak-header">
    <div class="ak-wrap ak-bar">
      <a class="ak-brand" href="contacts-groups.html">Личная CRM<b>.</b></a>
    </div>
  </header>

  <div class="ak-aurora-zone">
    <div class="ak-aurora" aria-hidden="true"></div>
    <main class="ak-wrap ak-main ak-stack-y">
      <nav class="ak-backs" aria-label="Назад">
        <a class="ak-back" href="groups.html"><svg class="ak-ico ak-ico-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>Все группы</a>
        <a class="ak-back" href="contacts-groups.html"><svg class="ak-ico ak-ico-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>Все контакты</a>
      </nav>

      <!-- a 50-character name: the subtitle wraps, the button moves below on a narrow screen -->
      <div class="ak-page-head">
        <div>
          <div class="ak-label">Всего: 0</div>
          <h1 class="ak-page-title">Контакты<span class="ak-page-sub">в группе <b>Выпускники курса интерьерного дизайна, поток 2019.</b></span></h1>
        </div>
        <a class="ak-btn ak-btn-primary" href="contact-new-groups.html"><svg class="ak-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>Добавить контакт</a>
      </div>

      <!-- empty group: no «Пора связаться» block -->
      <form class="ak-search" role="search">
        <label class="ak-search-box">
          <span class="ak-sr-only">Поиск по имени в группе «Выпускники курса интерьерного дизайна, поток 2019.»</span>
          <svg class="ak-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input class="ak-input" type="search" name="q" placeholder="Поиск по имени" value="">
        </label>
        <span class="ak-search-actions"><button class="ak-btn ak-btn-ghost" type="submit">Найти</button></span>
      </form>

      <div class="ak-empty">
        <h2 class="ak-empty-title">В группе пока никого нет</h2>
        <p>Добавь контакт кнопкой выше — группа будет уже отмечена. Или добавь людей в группу в их карточке.</p>
      </div>
    </main>
  </div>
</div>
</body>
</html>
