<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Поиск внутри группы — эскиз</title>
  <link rel="stylesheet" href="vendor/fonts.css">
  <link rel="stylesheet" href="vendor/tokens.css">
  <link rel="stylesheet" href="vendor/styles.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
<div class="ak-root">
  <header class="ak-header">
    <div class="ak-wrap ak-bar">
      <a class="ak-brand" href="contacts-groups.html">Личная CRM<b>.</b></a>
    </div>
  </header>

  <div class="ak-aurora-zone">
    <div class="ak-aurora" aria-hidden="true"></div>
    <main class="ak-wrap ak-main ak-stack-y">
      <div class="ak-page-head">
        <div>
          <div class="ak-label">Найдено: 1</div>
          <h1 class="ak-page-title">Контакты</h1>
        </div>
        <a class="ak-btn ak-btn-primary" href="contact-new-groups.html"><svg class="ak-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>Добавить контакт</a>
      </div>

      <nav class="ak-switch" aria-label="Разделы"><a href="contacts-groups.html" aria-current="page">Контакты</a><a href="groups.html">Группы</a></nav>

      <form class="ak-search-form" role="search">
        <div class="ak-search">
          <label class="ak-search-box">
            <span class="ak-sr-only">Поиск по имени</span>
            <svg class="ak-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <input class="ak-input" type="search" name="q" placeholder="Поиск по имени" value="Иван">
          </label>
          <span class="ak-search-actions"><button class="ak-btn ak-btn-ghost" type="submit">Найти</button><a class="ak-btn ak-btn-text" href="contacts-filter.html" aria-label="Сбросить поиск">Сбросить</a></span>
        </div>
        <span class="ak-select-box ak-select-labeled">
          <label class="ak-select-label" for="group">Фильтр по группам</label>
          <select class="ak-input ak-select" id="group" name="group"><option value="">Все группы</option><option>Аналитики</option><option>Бывшие коллеги</option><option>Врачи</option><option>Выпускники курса интерьерного дизайна, поток 2019.</option><option>Дача</option><option>Друзья</option><option>Йога</option><option>Книжный клуб</option><option>Курсы дизайна</option><option>Мастера по ремонту</option><option>Родители класса</option><option>Семья</option><option>Соседи</option><option selected>Теннис</option><option>Цигун</option></select><svg class="ak-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </span>
      </form>

      <div class="ak-list ak-list-due ak-list-groups">
        <div class="ak-list-head" aria-hidden="true">
          <span>Имя</span><span>Кто это</span><span>Откуда знакомы</span><span>Группы</span><span></span>
        </div>
        <div class="ak-row ak-row-linked">
          <span class="ak-row-name"><span class="ak-due" aria-hidden="true"></span><a class="ak-row-link" href="contact-groups-a.html">Иван Петров</a></span>
          <span class="ak-row-meta">Инженер, играем по субботам</span>
          <span class="ak-row-meta ak-row-meta-extra">Корты в парке</span>
          <span class="ak-row-groups"><span class="ak-gchip" title="Теннис">Теннис</span></span>
          <span class="ak-row-go"><svg class="ak-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></span>
        </div>
      </div>
    </main>
  </div>
</div>
<script>
document.querySelectorAll('.ak-gmore').forEach((btn) => {
  const pop = document.getElementById(btn.getAttribute('popovertarget'));
  const isOpen = () => pop.matches(':popover-open');
  let timer;
  const open = () => { if (!isOpen()) pop.showPopover(); };
  const close = () => { if (isOpen()) pop.hidePopover(); };
  pop.addEventListener('toggle', (event) => {
    const opened = event.newState === 'open';
    btn.setAttribute('aria-expanded', String(opened));
    if (!opened) return;
    const r = btn.getBoundingClientRect();
    pop.style.top = (r.bottom + 8) + 'px';
    pop.style.left = Math.max(16, Math.min(r.right - pop.offsetWidth, innerWidth - pop.offsetWidth - 16)) + 'px'; // right edges aligned
  });
  btn.addEventListener('pointerenter', (event) => {
    if (event.pointerType !== 'mouse') return;
    clearTimeout(timer); timer = setTimeout(open, 150);
  });
  btn.addEventListener('pointerleave', (event) => {
    if (event.pointerType !== 'mouse') return;
    clearTimeout(timer); timer = setTimeout(() => { if (!pop.matches(':hover')) close(); }, 250);
  });
  pop.addEventListener('pointerenter', () => clearTimeout(timer));
  pop.addEventListener('pointerleave', () => { clearTimeout(timer); timer = setTimeout(close, 250); });
});
addEventListener('scroll', () => document.querySelectorAll('.ak-pop:popover-open').forEach((p) => p.hidePopover()), { passive: true });
// mockup only: show one open popover on load (the visible «+N» of the marked row)
const demo = [...document.querySelectorAll('.ak-gmore[data-demo-open]')].find((b) => b.offsetParent);
if (demo) document.getElementById(demo.getAttribute('popovertarget')).showPopover();
</script>
</body>
</html>
