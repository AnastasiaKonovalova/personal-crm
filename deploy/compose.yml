# Production stack on the server, project "prod": docker compose -p prod (see deploy.sh).
# Values come from .env (secrets, written by the owner) and image.env (current app image, written by deploy.sh).
# The server has little memory: every container has a memory cap, logs are size-limited.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    # Small-memory settings: the whole database fits in a few megabytes
    command:
      - postgres
      - -c
      - shared_buffers=32MB
      - -c
      - max_connections=20
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=16MB
      - -c
      - effective_cache_size=128MB
    ports:
      # Localhost only: reachable from the server itself or through an SSH tunnel
      - "127.0.0.1:5433:5432"
    volumes:
      # Postgres 18+ images keep data under /var/lib/postgresql/<major>/docker
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 160m
    logging: *logging

  # One-off container from the app image: applies migrations and exits (deploy.sh runs it before the new app)
  migrate:
    image: ${APP_IMAGE:?}
    command: ["node", "migrate.ts"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?}
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["migrate"]
    restart: "no"
    mem_limit: 128m
    logging: *logging

  app:
    image: ${APP_IMAGE:?}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?}
      NODE_OPTIONS: --max-old-space-size=128
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    mem_limit: 256m
    logging: *logging

volumes:
  pgdata:
