# Push to main -> the same checks as on a PR (ci.yml) -> app image tagged with the commit SHA in GHCR
# -> deploy/deploy.sh on the server.
# The workflow only calls the scripts from deploy/; what happens on the server is described there.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The whole ci.yml: lint, format, types, Vitest, e2e, image build. One copy of the checks for PR and deploy
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v7

      # GHCR image names must be lowercase
      - id: image
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      # The whole deploy/ folder: a new script goes to the server by itself
      - name: Copy deploy scripts
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            deploy/* \
            "crm-deploy@${DEPLOY_HOST}:/opt/personal-crm/"

      # The short-lived job token goes over stdin: the server only uses it to pull this image
      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          IMAGE: ${{ needs.build.outputs.image }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "crm-deploy@${DEPLOY_HOST}" \
            "bash /opt/personal-crm/deploy.sh '${IMAGE}' '${REGISTRY_USER}'"

      - name: Check live site
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          : "${APP_URL:?Set the APP_URL repository variable}"
          code=$(curl -s -o health.json -w '%{http_code}' "${APP_URL}/health")
          echo "Live /health: HTTP $code $(cat health.json)"
          test "$code" = 200
