# Push to main -> the same checks as on a PR (ci.yml) -> app image tagged with the commit SHA in GHCR
# -> the test stand (deploy-stand.yml). Prod is never deployed from here: the owner starts deploy-prod.yml.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The whole ci.yml: lint, format, types, Vitest, e2e, image build. One copy of the checks for PR and deploy
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # GHCR image names must be lowercase
      - id: image
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # A green run here is what Deploy prod looks for in the staging deploy history
  staging:
    needs: build
    uses: ./.github/workflows/deploy-stand.yml
    permissions:
      contents: read
      packages: read
    with:
      stand: staging
      url: https://test-app.mypeoplecrm.ru
      sha: ${{ github.sha }}
    secrets: inherit
