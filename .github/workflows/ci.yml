# Checks on every PR to main: lint, format, types, Vitest, e2e on a real database, image build.
# deploy.yml calls this same workflow before publishing the image, so a deploy runs exactly these checks.
name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:

# Called from deploy.yml, the github context is the caller's push: there is no PR number,
# so each deploy run gets its own group and never cancels the checks of another deploy.
# Must not equal a group of the caller ("deploy-<stand>"), or GitHub cancels the caller.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.11.2

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck

  unit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Mail stub of this CI run: sign-in emails stay here and never leave the runner
      mailpit:
        image: axllent/mailpit:v1.34.0
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway database of this CI run
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      # Throwaway values, not secrets: the database and the app live for this run only
      BETTER_AUTH_SECRET: ci-only-throwaway-value-for-this-run-0000
      BETTER_AUTH_URL: http://localhost:3000
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      SMTP_SECURE: false
      MAIL_FROM: '"Свои люди - Личная CRM" <noreply@example.test>'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.11.2

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Mail stub of this CI run: sign-in emails stay here and never leave the runner
      mailpit:
        image: axllent/mailpit:v1.34.0
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway database of this CI run
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      # Throwaway values, not secrets: the database and the app live for this run only
      BETTER_AUTH_SECRET: ci-only-throwaway-value-for-this-run-0000
      BETTER_AUTH_URL: http://localhost:3000
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      SMTP_SECURE: false
      MAIL_FROM: '"Свои люди - Личная CRM" <noreply@example.test>'
      # All e2e requests come from one address: Better Auth's per-IP limit is off for this run only
      # (design.md of the login change, decision 2а). Quoted: unquoted off is a YAML boolean
      E2E_AUTH_IP_LIMIT: "off"
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.11.2

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm build

      - name: Start app
        run: |
          pnpm start > app.log 2>&1 &
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:3000/health && exit 0
            sleep 1
          done
          cat app.log
          exit 1

      - run: pnpm exec playwright install --with-deps chromium

      - name: HTTP e2e
        run: pnpm exec vitest run --config vitest.e2e.config.ts

      - name: Browser e2e
        run: pnpm exec playwright test

      - name: App log
        if: failure()
        run: cat app.log

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Build only: publishing happens in deploy.yml after merge
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
